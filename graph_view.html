<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph View</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="graph.js"></script>
    <script src="path_finder.js"></script>
    <style>
        /* Animated Background */
        @keyframes backgroundGlow {
            0% { background: #1b0033; }
            50% { background: #003366; }
            100% { background: #1b0033; }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            animation: backgroundGlow 5s infinite alternate;
            overflow-x: hidden;
        }

        .content {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
            padding: 20px;
        }

        .container {
            width: 900px; 
            height: 1220px;
            padding: 24px;
            border: 5px solid #00e5ff;
            box-shadow: 0 0 15px #00e5ff;
            background-image: url('/bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
            flex-shrink: 0;
        }

        h1 {
            text-align: center;
            font-size: 30px;
            color: #000000;
            text-decoration: underline;
            text-shadow: 0 0 10px #ffcc00, 0 0 20px #ff9900;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin-top: 20px;
        }

        .distance {
            width: 300px; 
            padding: 20px;
            border: 5px solid #ffcc00;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: static; 
            margin-top: 20px;
            margin-left: 30px;
        }

        @media (max-width: 1024px) {
            .content {
                flex-direction: column;
                align-items: center;
            }
            .distance {
                width: 90%;
                margin: 20px auto;
            }
        }

        #graph {
            width: 100px;
            height: 400px;
        }

        .path-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .path-list li {
            display: flex;
            align-items: center;
            flex-direction: column;
            margin-top: 10px;
            margin-bottom: 40px;
            font-size: 1.6em;
            font-weight: bold;
            color: #0c0501;
            text-shadow: 0 0 10px #ff3300;
            position: relative;
        }

        .path-list li::after {
            top: 60px;
            content: '↓';
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.8em;
            color: #ff3300;
        }

        .path-list li:last-child::after {
            content: '';
        }

        #min-cost {
            margin-top: 20px;
            font-size: 1.6em;
            font-weight: bold;
            font-style: italic;
            background: linear-gradient(135deg, rgba(7, 17, 0, 0.1), rgba(255, 255, 255, 0.1));
            padding: 10px;
            border-radius: 7px;
            color: #1d010a;
            text-shadow: 0 0 10px #ff004c;
            box-shadow: 0 4px 8px rgba(0, 255, 255, 0.5);
            text-align: center;
            max-width: 90%;
        }
        .tam{
            font-size: 50px;
            color: #ffffff;
            position: relative;
            right: 400px;
            top: 20px;
            text-shadow: 0 0 10px #000a05, 0 0 20px #120b00;

        }
    </style>
</head>
<body>
    <h1 class="tam">Tamil Nadu Map</h1>
    <div class="content">
        <div class="container">
            <h1>
            <div id="graph">
                <script>
                    const urlParams = new URLSearchParams(window.location.search);
                    const source = urlParams.get('source');
                    const destination = urlParams.get('destination');
                    const res = dijkstra(source, destination);
                    const path = res.minPath;
                    const highlightedPath = [];

                    for (let i = 0; i < path.length - 1; i++) {
                        highlightedPath.push({
                            source: path[i],
                            target: path[i + 1]
                        });
                    }

                    createGraph(cities, highlightedPath);
                    console.log(res.minCost);
                </script>
            </div>
        </div>

        <div class="distance">
            <h1>Minimum Distance</h1>

            <ul id="path-list" class="path-list"></ul>
            <div id="min-cost"></div>
            <script>
                const pathData = JSON.parse(localStorage.getItem('formattedPathData'));
                console.log("see here", pathData);

                const minCost = localStorage.getItem('minicost');

                const pathList = document.getElementById('path-list');
                pathData.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.textContent = item.city;

                    if (index < pathData.length - 1) {
                        const distance = document.createElement('div');
                        distance.textContent = `${item.distance} km`;
                        li.appendChild(distance);
                    }

                    pathList.appendChild(li);
                });

                const minCostElement = document.getElementById('min-cost');
                minCostElement.textContent = `Total Distance is : ${minCost} km`;
            </script>
        </div>
    </div>

</body>
</html>
